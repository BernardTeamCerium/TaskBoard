# TaskBoard on Netlify
#  - public/ is the website
#  - netlify/functions/api.mjs serves every /api/* request
#  - netlify/functions/scheduled.mjs sends reminders/digests/monthly reports every 15 min
#  - all data is stored in Netlify Blobs (store "taskboard"), with a daily backup copy
[build]
  publish = "public"
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
