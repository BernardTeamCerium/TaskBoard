# Netlify demo: a static site only — no server or functions.
# The TaskBoard API runs inside the visitor's browser (demo/entry.js) and saves
# to that browser's localStorage. netlify-demo/ is pre-built and committed, so
# Netlify has nothing to build. After changing the app, run `npm run build:demo`
# and commit netlify-demo/.
[build]
  publish = "netlify-demo"
  command = ""

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
